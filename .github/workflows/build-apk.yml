# Автосборка: после каждого изменения GitHub сам собирает APK.
# Скачать на телефон: страница репозитория → Releases → «Последняя сборка» → app-debug.apk
# Если создать релиз вручную (Releases → Draft a new release), APK приложится к нему сам.
# Метка версии (git tag v0.2 и т.п.) сама создаёт релиз с APK; описание берётся из release-notes/<метка>.md
name: Сборка APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Приложить APK к релизу с этим тегом (необязательно)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Собрать debug-APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Опубликовать в «Последняя сборка»
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "Последняя сборка" \
            --notes "Тестовая сборка из коммита ${GITHUB_SHA::7}: ${COMMIT_MSG%%$'\n'*}" \
            --prerelease --latest=false
      - name: Приложить APK к релизу, созданному вручную
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          # Старые APK в этом релизе заменяем новым
          for old in $(gh release view "$TAG" --json assets --jq '.assets[].name | select(endswith(".apk"))'); do
            gh release delete-asset "$TAG" "$old" --yes
          done
          cp app/build/outputs/apk/debug/app-debug.apk "sanarar-kinige-${TAG}.apk"
          gh release upload "$TAG" "sanarar-kinige-${TAG}.apk"
      - name: Выпустить релиз по метке версии
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "sanarar-kinige-${TAG}.apk"
          NOTES="release-notes/${TAG}.md"
          [ -f "$NOTES" ] || { echo "Сборка из метки ${TAG}" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          TITLE=$(head -n 1 "$NOTES" | sed 's/^# *//')
          gh release create "$TAG" "sanarar-kinige-${TAG}.apk" --title "$TITLE" --notes-file <(tail -n +2 "$NOTES") --latest
