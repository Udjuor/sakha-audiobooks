# Автосборка: после каждого изменения GitHub сам собирает APK.
# Скачать на телефон: страница репозитория → Releases → «Последняя сборка» → app-debug.apk
# Если создать релиз вручную (Releases → Draft a new release), APK приложится к нему сам.
# Новый релиз: добавить файл release-notes/<версия>.md (первая строка — заголовок) и отправить в main —
# автосборка сама создаст релиз с этой меткой и приложит APK.
name: Сборка APK

on:
  push:
    branches: ['**']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Приложить APK к релизу с этим тегом (необязательно)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Таблицы контента → файлы приложения
        run: |
          python3 tools/learning_csv.py to-json
          python3 tools/strings_csv.py to-xml
      - name: Собрать debug-APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log
      - name: Показать ошибки сборки
        if: failure()
        run: |
          ERRORS=$(grep -E "^e: |error:|What went wrong|^> " build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Ошибки сборки::${ERRORS:-см. журнал сборки}"
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Опубликовать в «Последняя сборка»
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "Последняя сборка" \
            --notes "Тестовая сборка из коммита ${GITHUB_SHA::7}: ${COMMIT_MSG%%$'\n'*}" \
            --prerelease --latest=false
      - name: Приложить APK к релизу, созданному вручную
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          # Старые APK в этом релизе заменяем новым
          for old in $(gh release view "$TAG" --json assets --jq '.assets[].name | select(endswith(".apk"))'); do
            gh release delete-asset "$TAG" "$old" --yes
          done
          cp app/build/outputs/apk/debug/app-debug.apk "sanarar-kinige-${TAG}.apk"
          gh release upload "$TAG" "sanarar-kinige-${TAG}.apk"
      - name: Выпустить новые релизы из release-notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for NOTES in release-notes/*.md; do
            TAG=$(basename "$NOTES" .md)
            if gh release view "$TAG" >/dev/null 2>&1; then continue; fi
            cp app/build/outputs/apk/debug/app-debug.apk "sanarar-kinige-${TAG}.apk"
            TITLE=$(head -n 1 "$NOTES" | sed 's/^# *//')
            tail -n +2 "$NOTES" > /tmp/notes.md
            gh release create "$TAG" "sanarar-kinige-${TAG}.apk" --target "$GITHUB_SHA" \
              --title "$TITLE" --notes-file /tmp/notes.md --latest
          done
